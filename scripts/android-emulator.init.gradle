// Rebuild the embedded JavaScript when switching the API URL between builds.
gradle.beforeProject { project ->
    project.tasks.configureEach { task ->
        if (task.name.startsWith('createBundle') && task.name.endsWith('JsAndAssets')) {
            task.inputs.property('kakFitApiUrl', project.providers.environmentVariable('EXPO_PUBLIC_API_URL').orElse('http://localhost:3000'))
        }
    }
}
